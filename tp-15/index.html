<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body id="cuerpo-pagina">
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="m-0">Tablero de Puntos</h1>
            <span id="badge-estado" class="badge bg-success fs-6">En juego</span>
        </div>

        <div class="card shadow-sm" id="tarjeta-tablero">
            <div class="card-body">
                <!-- Marcador Principal -->
                <div class="row text-center align-items-center py-3">
                    <div class="col-5">
                        <span id="puntos-local" class="display-1 fw-bold" style="color: #0d6efd;">0</span>
                        <p id="nombre-local" class="m-0 fs-4 fw-semibold">Local</p>
                    </div>
                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>
                    <div class="col-5">
                        <span id="puntos-visitante" class="display-1 fw-bold" style="color: #dc3545;">0</span>
                        <p id="nombre-visitante" class="m-0 fs-4 fw-semibold">Visitante</p>
                    </div>
                </div>

                <hr class="hr">

                <!-- Controles de Puntaje (+ y -) -->
                <h2>Actualizar Contador</h2>
                <div class="row g-2 mb-3">
                    <!-- Controles Local -->
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-bold text-muted">Equipo Local</label>
                        <div class="btn-group w-100" role="group">
                            <button type="button" id="btn-sumar-local" class="btn btn-primary btn-puntaje">
                                + Punto Local
                            </button>
                            <button type="button" id="btn-restar-local" class="btn btn-outline-primary btn-puntaje">
                                -1
                            </button>
                        </div>
                    </div>

                    <!-- Controles Visitante -->
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-bold text-muted">Equipo Visitante</label>
                        <div class="btn-group w-100" role="group">
                            <button type="button" id="btn-sumar-visitante" class="btn btn-primary btn-puntaje">
                                + Punto Visitante
                            </button>
                            <button type="button" id="btn-restar-visitante" class="btn btn-outline-primary btn-puntaje">
                                -1
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Acciones del Partido: Invertir, Finalizar, Reinicio -->
                <div class="row g-2">
                    <div class="col-12 col-sm-4">
                        <button type="button" id="btn-invertir" class="btn d-block w-100 btn-warning btn-puntaje">
                            ⇄ Invertir Puntaje
                        </button>
                    </div>
                    <div class="col-12 col-sm-4">
                        <button type="button" id="btn-finalizar" class="btn d-block w-100 btn-secondary">
                            Finalizar Partido
                        </button>
                    </div>
                    <div class="col-12 col-sm-4">
                        <button type="button" id="btn-reiniciar" class="btn d-block w-100 btn-danger">
                            Reinicio
                        </button>
                    </div>
                </div>

                <hr class="hr">

                <!-- Bonus Track: Personalización de Nombres y Colores -->
                <h3>Personalización</h3>
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="input-nombre-local" class="form-label">Nombre y color Local</label>
                        <div class="input-group">
                            <input type="text" id="input-nombre-local" class="form-control" value="Local" placeholder="Nombre Local">
                            <input type="color" id="color-local" class="form-control form-control-color" value="#0d6efd" title="Elegir color del equipo local">
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="input-nombre-visitante" class="form-label">Nombre y color Visitante</label>
                        <div class="input-group">
                            <input type="text" id="input-nombre-visitante" class="form-control" value="Visitante" placeholder="Nombre Visitante">
                            <input type="color" id="color-visitante" class="form-control form-control-color" value="#dc3545" title="Elegir color del equipo visitante">
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="color-fondo" class="form-label">Color de fondo del tablero</label>
                        <input type="color" id="color-fondo" class="form-control form-control-color w-100" value="#ffffff" title="Elegir color de fondo">
                    </div>
                </div>

                <!-- Referencia de Atajos de Teclado -->
                <div class="mt-3 pt-2 border-top text-muted small">
                    <strong>Atajos de teclado:</strong>
                    <kbd>Q</kbd> / <kbd>A</kbd> (+1 / -1 Local) &bull;
                    <kbd>P</kbd> / <kbd>L</kbd> (+1 / -1 Visitante) &bull;
                    <kbd>I</kbd> (Invertir) &bull;
                    <kbd>F</kbd> (Finalizar) &bull;
                    <kbd>R</kbd> (Reiniciar)
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        // Estado del partido
        let puntosLocal = 0;
        let puntosVisitante = 0;
        let partidoFinalizado = false;

        // Referencias al DOM
        const spanPuntosLocal = document.getElementById('puntos-local');
        const spanPuntosVisitante = document.getElementById('puntos-visitante');
        const textoNombreLocal = document.getElementById('nombre-local');
        const textoNombreVisitante = document.getElementById('nombre-visitante');
        const badgeEstado = document.getElementById('badge-estado');
        const botonesPuntaje = document.querySelectorAll('.btn-puntaje');

        /**
         * Actualiza los números en pantalla.
         */
        function actualizarMarcador() {
            spanPuntosLocal.textContent = puntosLocal;
            spanPuntosVisitante.textContent = puntosVisitante;
        }

        /**
         * Suma o resta puntos validando que el partido siga activo y no baje de 0.
         */
        function modificarPuntaje(equipo, delta) {
            if (partidoFinalizado) return;

            if (equipo === 'local') {
                puntosLocal = Math.max(0, puntosLocal + delta);
            } else if (equipo === 'visitante') {
                puntosVisitante = Math.max(0, puntosVisitante + delta);
            }
            actualizarMarcador();
        }

        /**
         * Intercambia los puntos entre Local y Visitante usando desestructuración.
         */
        function invertirPuntaje() {
            if (partidoFinalizado) return;

            [puntosLocal, puntosVisitante] = [puntosVisitante, puntosLocal];
            actualizarMarcador();
        }

        /**
         * Finaliza el partido y deshabilita todos los botones que alteran puntos.
         */
        function finalizarPartido() {
            partidoFinalizado = true;
            botonesPuntaje.forEach(btn => btn.disabled = true);
            document.getElementById('btn-finalizar').disabled = true;

            badgeEstado.textContent = 'Finalizado';
            badgeEstado.classList.replace('bg-success', 'bg-dark');
        }

        /**
         * Reinicia los puntos a 0 y vuelve a habilitar los botones.
         */
        function reiniciarTablero() {
            puntosLocal = 0;
            puntosVisitante = 0;
            partidoFinalizado = false;

            botonesPuntaje.forEach(btn => btn.disabled = false);
            document.getElementById('btn-finalizar').disabled = false;

            badgeEstado.textContent = 'En juego';
            badgeEstado.classList.replace('bg-dark', 'bg-success');

            actualizarMarcador();
        }

        // --- Event Listeners de Botones ---
        document.getElementById('btn-sumar-local').addEventListener('click', () => modificarPuntaje('local', 1));
        document.getElementById('btn-restar-local').addEventListener('click', () => modificarPuntaje('local', -1));
        document.getElementById('btn-sumar-visitante').addEventListener('click', () => modificarPuntaje('visitante', 1));
        document.getElementById('btn-restar-visitante').addEventListener('click', () => modificarPuntaje('visitante', -1));
        document.getElementById('btn-invertir').addEventListener('click', invertirPuntaje);
        document.getElementById('btn-finalizar').addEventListener('click', finalizarPartido);
        document.getElementById('btn-reiniciar').addEventListener('click', reiniciarTablero);

        // --- Event Listeners de Personalización (Bonus Track) ---
        document.getElementById('input-nombre-local').addEventListener('input', (e) => {
            textoNombreLocal.textContent = e.target.value.trim() || 'Local';
        });

        document.getElementById('input-nombre-visitante').addEventListener('input', (e) => {
            textoNombreVisitante.textContent = e.target.value.trim() || 'Visitante';
        });

        document.getElementById('color-local').addEventListener('input', (e) => {
            spanPuntosLocal.style.color = e.target.value;
            textoNombreLocal.style.color = e.target.value;
        });

        document.getElementById('color-visitante').addEventListener('input', (e) => {
            spanPuntosVisitante.style.color = e.target.value;
            textoNombreVisitante.style.color = e.target.value;
        });

        document.getElementById('color-fondo').addEventListener('input', (e) => {
            document.getElementById('tarjeta-tablero').style.backgroundColor = e.target.value;
        });

        // --- Event Listener de Atajos de Teclado (Bonus Track) ---
        document.addEventListener('keydown', (e) => {
            // Evita activar atajos mientras el usuario escribe en un campo de texto
            if (e.target.tagName === 'INPUT') return;

            const tecla = e.key.toLowerCase();
            switch (tecla) {
                case 'q':
                    modificarPuntaje('local', 1);
                    break;
                case 'a':
                    modificarPuntaje('local', -1);
                    break;
                case 'p':
                    modificarPuntaje('visitante', 1);
                    break;
                case 'l':
                    modificarPuntaje('visitante', -1);
                    break;
                case 'i':
                    invertirPuntaje();
                    break;
                case 'f':
                    finalizarPartido();
                    break;
                case 'r':
                    reiniciarTablero();
                    break;
            }
        });
    </script>
</body>
</html>
